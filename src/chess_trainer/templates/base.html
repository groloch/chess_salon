<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Chess Trainer{% endblock %}</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #353839; /* Onyx */
      --surface: #292c2d;
      --surface-raised: #3f4345;
      --surface-inset: #222526;
      --border: #62696c;
      --primary: #0F52BA; /* Sapphire */
      --accent: #E0115F; /* Ruby */
      --accent-deep: #ae0d4a;
      --accent-light: #ff8db7;
      --text: #f4f5f5;
      --text-muted: #c1c7ca;
      --text-subtle: #aeb7bb;
      --focus: #8db9ff;
      --success: #6fe0aa;
      --warning: #f0c37b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    /* Scoped to .app-header so component <header> elements (e.g. session
       frames on dashboards) are not styled as the application header. */
    .app-header {
      background: var(--surface);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      gap: 2rem;
      box-shadow: 0 2px 8px rgba(0,0,0,.4);
    }
    .app-header h1 { font-size: 1.4rem; }
    .brand { color: var(--text); text-decoration: none; }
    .app-header nav { display: flex; flex-wrap: wrap; gap: .25rem; }
    @media (max-width: 760px) {
      .app-header { padding: 1rem; gap: 1rem; flex-wrap: wrap; }
      .app-header nav { order: 3; width: 100%; }
    }
    .app-header nav a {
      color: var(--text);
      text-decoration: none;
      padding: .4rem .8rem;
      border-radius: 4px;
      transition: background .2s;
    }
    .app-header nav a:hover { background: var(--primary); }
    .app-header .auth-widget {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: .6rem;
      font-size: .95rem;
    }
    .app-header .auth-widget a.auth-signin {
      color: var(--text);
      background: var(--accent);
      text-decoration: none;
      padding: .45rem .9rem;
      border-radius: 4px;
    }
    .app-header .auth-widget .auth-username { color: var(--text); font-weight: 600; }
    .app-header .auth-widget button.auth-logout {
      background: var(--primary);
      color: var(--text);
      border: none;
      padding: .45rem .9rem;
      border-radius: 4px;
      cursor: pointer;
    }
    a { color: var(--focus); }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    main { padding: 2rem; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header class="app-header">
    <h1><a class="brand" href="/" aria-label="Chess Trainer home">Chess Trainer</a></h1>
    <nav>
      <a href="/analysis">Analysis Board</a>
      <a href="/blind_puzzles">Blindfold Puzzles</a>
    </nav>
    <div id="auth-widget" class="auth-widget"></div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="/static/js/auth.js" type="module"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
